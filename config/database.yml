# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# ---- PRODUCTION (PostgreSQL-ready) ----
# NFR5: Production uses PostgreSQL for concurrent writes and scalability.
# To use: set DATABASE_URL env var or POSTGRES_* variables.
# Falls back to SQLite if no Postgres config is set.
production:
  primary:
    adapter: <%= ENV['DATABASE_URL'] ? 'postgresql' : 'sqlite3' %>
    url: <%= ENV['DATABASE_URL'] %>
    <% unless ENV['DATABASE_URL'] %>
    database: <%= ENV['POSTGRES_DB'] || 'storage/production.sqlite3' %>
    username: <%= ENV['POSTGRES_USER'] || '' %>
    password: <%= ENV['POSTGRES_PASSWORD'] || '' %>
    host: <%= ENV['POSTGRES_HOST'] || 'localhost' %>
    port: <%= ENV['POSTGRES_PORT'] || 5432 %>
    <% else %>
    <% if ENV['POSTGRES_DB'] %>
    database: <%= ENV['POSTGRES_DB'] %>
    <% end %>
    <% if ENV['POSTGRES_USER'] %>
    username: <%= ENV['POSTGRES_USER'] %>
    <% end %>
    <% if ENV['POSTGRES_PASSWORD'] %>
    password: <%= ENV['POSTGRES_PASSWORD'] %>
    <% end %>
    <% if ENV['POSTGRES_HOST'] %>
    host: <%= ENV['POSTGRES_HOST'] %>
    <% end %>
    <% if ENV['POSTGRES_PORT'] %>
    port: <%= ENV['POSTGRES_PORT'] %>
    <% end %>
    <% end %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    encoding: unicode
  cache:
    adapter: <%= ENV['DATABASE_URL'] ? 'postgresql' : 'sqlite3' %>
    url: <%= ENV['DATABASE_URL'] %>
    <% unless ENV['DATABASE_URL'] %>
    database: storage/production_cache.sqlite3
    <% end %>
    migrations_paths: db/cache_migrate
  queue:
    adapter: <%= ENV['DATABASE_URL'] ? 'postgresql' : 'sqlite3' %>
    url: <%= ENV['DATABASE_URL'] %>
    <% unless ENV['DATABASE_URL'] %>
    database: storage/production_queue.sqlite3
    <% end %>
    migrations_paths: db/queue_migrate
  cable:
    adapter: <%= ENV['DATABASE_URL'] ? 'postgresql' : 'sqlite3' %>
    url: <%= ENV['DATABASE_URL'] %>
    <% unless ENV['DATABASE_URL'] %>
    database: storage/production_cable.sqlite3
    <% end %>
    migrations_paths: db/cable_migrate
